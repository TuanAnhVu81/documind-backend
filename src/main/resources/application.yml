spring:
  application:
    name: documind-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
      data-source-properties:
        socketTimeout: ${DB_SOCKET_TIMEOUT_SECONDS:15}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
    user: ${DB_MIGRATION_USERNAME:${DB_USERNAME}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
  ai:
    model:
      chat: none
      embedding: none
      embedding.text: none
      embedding.multimodal: none
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    chat:
      client:
        enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    problemdetails:
      enabled: true
  task:
    scheduling:
      pool:
        size: 3
server:
  port: ${SERVER_PORT:${PORT:8080}}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,pgvector
logging:
  level:
    root: INFO
    org.hibernate.orm.jdbc.error: "OFF"
  threshold:
    console: INFO
  structured:
    format:
      console: logstash
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
documind:
  upload:
    max-per-window: ${UPLOAD_MAX_PER_WINDOW:10}
    window-seconds: ${UPLOAD_WINDOW_SECONDS:60}
  chat:
    enabled: false
  gemini:
    enabled: false
  retrieval:
    top-k: 5
    hybrid-enabled: ${RETRIEVAL_HYBRID_ENABLED:false}
    rerank-enabled: ${RETRIEVAL_RERANK_ENABLED:false}
    # Disable only for evaluation ablation; multi-turn resolution is required for release.
    rewrite-enabled: ${RETRIEVAL_REWRITE_ENABLED:true}
    # Baseline only; must be calibrated on the approved evaluation set.
    min-score: -1
  ingestion:
    worker-enabled: false
    pipeline-enabled: false
    embedding-model: gemini-embedding-2
    embedding-batch-size: 32
    embedding-timeout-seconds: 60
    chunk-size: 1000
    chunk-overlap: 150
    poll-ms: 2000
    concurrency: 2
    lease-seconds: 120
    heartbeat-seconds: 20
    recovery-ms: 30000
    deadline-seconds: 600
    stop-grace-seconds: 10
  storage:
    backend: ${DOCUMENT_STORAGE_BACKEND:local}
    path: ${DOCUMENT_STORAGE_PATH:./uploads}
    cleanup-interval-ms: 30000
    orphan-interval-ms: 3600000
  parser:
    max-pdf-pages: 200
    max-code-points: 1000000
    max-chunks: 5000
    timeout-seconds: 30
  auth:
    jwt-secret: ${JWT_SECRET:}
    issuer: documind
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:}
    login-max-attempts: 10
    register-max-attempts: 10
    login-window-seconds: 60
