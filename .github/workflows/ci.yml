name: Backend CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate evaluation fixtures
        run: |
          python -m pip install -r eval/requirements.txt
          python eval/validate.py
          python -m unittest discover -s eval -p "test_*.py"
      - name: Unit and PostgreSQL integration tests
        # No TEST_DB_URL in CI: tests start disposable pgvector Testcontainers.
        run: bash mvnw -B -ntp verify
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-verification
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
