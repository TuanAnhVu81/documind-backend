name: Backend CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate evaluation fixtures
        run: |
          python -m pip install -r eval/requirements.txt
          python eval/validate.py
          python -m unittest discover -s eval -p "test_*.py"
      - name: Unit and PostgreSQL integration tests
        # No TEST_DB_URL in CI: tests start disposable pgvector Testcontainers.
        run: bash mvnw -B -ntp verify
      - name: Scan repository for secrets
        run: docker run --rm -v "$PWD:/src:ro" ghcr.io/gitleaks/gitleaks:v8.24.3 detect --source=/src --no-git --redact
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
      - name: Build image from verified JAR
        run: |
          docker build -t "documind-backend:${GITHUB_SHA}" .
          expected=$(sha256sum target/documind-backend-0.0.1-SNAPSHOT.jar | cut -d ' ' -f 1)
          actual=$(docker run --rm --entrypoint sha256sum "documind-backend:${GITHUB_SHA}" /app/app.jar | cut -d ' ' -f 1)
          test "$expected" = "$actual"
      - name: Scan image dependencies and operating system
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: documind-backend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Save verified image
        run: |
          docker save "documind-backend:${GITHUB_SHA}" | gzip > documind-backend-image.tar.gz
      - name: Upload image tagged with commit SHA
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ github.sha }}
          path: documind-backend-image.tar.gz
          retention-days: 7
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-verification
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
